<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maxwell Damian FCFA Converter</title>
  <!-- Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Flutterwave Official Inline Payment SDK -->
  <script src="https://checkout.flutterwave.com/v3.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-6">
    
    <!-- BRANDED HEADER -->
    <div class="text-center space-y-1">
      <span class="inline-block px-3 py-1 bg-blue-100 text-blue-700 font-semibold text-xs rounded-full">
        Maxwell Damian Suite
      </span>
      <h1 class="text-2xl font-bold text-slate-800">Maxwell Damian FCFA Converter</h1>
      <p class="text-slate-500 text-sm">Convert any world currency to FCFA instantly</p>
    </div>

    <!-- 1. CONVERTER SECTION -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Amount</label>
        <input type="number" id="amount" value="100" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">From Currency</label>
        <select id="fromCurrency" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="USD">USD - US Dollar</option>
          <option value="EUR">EUR - Euro</option>
          <option value="GBP">GBP - British Pound</option>
          <option value="NGN">NGN - Nigerian Naira</option>
          <option value="CAD">CAD - Canadian Dollar</option>
          <option value="GHS">GHS - Ghanaian Cedi</option>
        </select>
      </div>

      <button onclick="convertCurrency()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition">
        Convert to FCFA
      </button>

      <!-- RESULT BOX -->
      <div id="resultBox" class="hidden p-4 bg-slate-50 rounded-xl border border-slate-200 text-center">
        <span class="text-xs text-slate-500 block">Converted Result</span>
        <span id="resultValue" class="text-2xl font-extrabold text-blue-600">0 FCFA</span>
      </div>
    </div>

    <hr class="border-slate-200">

    <!-- 2. BRANDED PAYMENT SECTION -->
    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center space-y-3">
      <h2 class="font-bold text-slate-800">Maxwell Damian Premium Access</h2>
      <p class="text-slate-600 text-xs">Direct payment of <strong>3,500 FCFA</strong> to use or support this service</p>
      
      <button onclick="makePayment()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition">
        Pay 3,500 FCFA Now
      </button>
    </div>

  </div>

  <script>
    // ------------------------------------------------------------------------
    // 1. CURRENCY CONVERSION FUNCTION
    // ------------------------------------------------------------------------
    async function convertCurrency() {
      const amount = parseFloat(document.getElementById('amount').value);
      const fromCurrency = document.getElementById('fromCurrency').value;
      const resultBox = document.getElementById('resultBox');
      const resultValue = document.getElementById('resultValue');

      if (isNaN(amount) || amount <= 0) {
        alert("Please enter a valid amount.");
        return;
      }

      try {
        const res = await fetch(`https://open.er-api.com/v6/latest/${fromCurrency}`);
        const data = await res.json();
        
        // Central African FCFA = XAF, West African FCFA = XOF
        const rateToFCFA = data.rates.XAF || data.rates.XOF;
        const totalInFCFA = (amount * rateToFCFA).toLocaleString('fr-FR', { maximumFractionDigits: 0 });
        
        resultValue.innerText = `${totalInFCFA} FCFA`;
        resultBox.classList.remove('hidden');
      } catch (error) {
        alert("Failed to fetch exchange rates. Check your internet connection.");
      }
    }

    // ------------------------------------------------------------------------
    // 2. FLUTTERWAVE PAYMENT INTEGRATION (3,500 FCFA)
    // ------------------------------------------------------------------------
    function makePayment() {
      FlutterwaveCheckout({
        public_key: "FLWPUBK_TEST-SANDBOXDEMOKEY-X", // Replace with your live Flutterwave Public Key
        tx_ref: "MD_TXN_" + Date.now(),
        amount: 3500,
        currency: "XAF",
        payment_options: "mobilemoneyfranco, card",
        customer: {
          email: "user@example.com",
          phone_number: "237600000000",
          name: "App User",
        },
        customizations: {
          title: "Maxwell Damian FCFA Service",
          description: "Payment of 3,500 FCFA to Maxwell Damian Account",
          logo: "https://via.placeholder.com/150",
        },
        callback: function (data) {
          console.log("Payment successful:", data);
          alert("Payment of 3,500 FCFA to Maxwell Damian confirmed! Ref: " + data.tx_ref);
        },
        onclose: function() {
          console.log("Payment window closed.");
        }
      });
    }
  </script>
</body>
</html>
