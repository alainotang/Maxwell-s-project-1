<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxwell Damian Foumbot Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            height: 100vh;
            width: 100vw;
        }
        .info-box {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .info-box h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 4px;
        }
        .info-box p {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="info-box">
        <h2>Foumbot Interactive Map</h2>
        <p>Quarters & Bus Stations Guide</p>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialize map centered directly on Foumbot
        const map = L.map('map').setView([5.5083, 10.6308], 14);

        // 2. Add OpenStreetMap Tile Layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 3. Foumbot Quarters (Neighborhood Zones)
        const quarters = [
            { name: "Foumbot Centre / Ville", lat: 5.5083, lng: 10.6308 },
            { name: "Foumbot-Mancha", lat: 5.5120, lng: 10.6250 },
            { name: "Koupara", lat: 5.4980, lng: 10.6350 },
            { name: "Mangoum", lat: 5.4850, lng: 10.6120 },
            { name: "Ngouen", lat: 5.5200, lng: 10.6400 },
            { name: "Kougham", lat: 5.5150, lng: 10.6150 }
        ];

        quarters.forEach(q => {
            L.circle([q.lat, q.lng], {
                color: '#2b5797',
                fillColor: '#3388ff',
                fillOpacity: 0.25,
                radius: 400
            }).addTo(map).bindPopup(`<b>Quarter:</b> ${q.name}`);
        });

        // 4. Bus Stations & Travel Agencies
        const busStations = [
            { name: "Gare Routière Principal de Foumbot", lat: 5.5075, lng: 10.6320, details: "Main central taxi & minibus park" },
            { name: "Musango Bus Terminal", lat: 5.5090, lng: 10.6300, details: "Inter-city travel agency (Buea, Douala, Yaoundé)" },
            { name: "General Express Stop (N6 Highway)", lat: 5.5060, lng: 10.6315, details: "Main transit stop along Bafoussam - Foumban route" },
            { name: "Gare Routière de Mangoum", lat: 5.4870, lng: 10.6140, details: "Local market bus and transport stop" }
        ];

        busStations.forEach(station => {
            L.marker([station.lat, station.lng])
                .addTo(map)
                .bindPopup(`<b>🚌 ${station.name}</b><br>${station.details}`);
        });
    </script>
</body>
</html>
