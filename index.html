<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxwell Damian Interactive Foumbot Map: Find Your Way In and Out</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            height: calc(100vh - 70px);
            width: 100vw;
            margin-top: 70px;
        }
        .header-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: #1a252f;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 2000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            gap: 10px;
        }
        .header-title {
            font-size: 14px;
            font-weight: bold;
            color: #f1c40f;
            line-height: 1.2;
        }
        .header-subtitle {
            font-size: 10px;
            color: #bdc3c7;
            margin-top: 2px;
        }
        .controls-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-input {
            padding: 7px 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 12px;
            outline: none;
            width: 160px;
        }
        .locate-btn {
            background: #27ae60;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .locate-btn:active {
            background: #1e8449;
        }
        .popup-coords {
            font-size: 11px;
            color: #e74c3c;
            font-weight: bold;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="header-banner">
        <div>
            <div class="header-title">Maxwell Damian Interactive Foumbot Map</div>
            <div class="header-subtitle">Find Your Way In and Out</div>
        </div>
        <div class="controls-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="Search area/carrefour..." onkeyup="searchLocation()">
            <button class="locate-btn" onclick="locateUser()">📍 My Location</button>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Force HTTPS for GPS permissions
        if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
            location.replace(`https:${location.href.substring(location.protocol.length)}`);
        }

        // 1. Initialize map centered on Foumbot
        const map = L.map('map').setView([5.5083, 10.6308], 13);

        // 2. Add OpenStreetMap Tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Registry array to hold searchable locations
        const searchRegistry = [];

        // 3. User Geolocation Handling
        let userMarker, userCircle;

        function locateUser() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const accuracy = position.coords.accuracy;

                        if (userMarker) {
                            map.removeLayer(userMarker);
                            map.removeLayer(userCircle);
                        }

                        userMarker = L.marker([lat, lng]).addTo(map)
                            .bindPopup(`<b>📍 You are here!</b><br>Accuracy radius: ${Math.round(accuracy)}m`).openPopup();

                        userCircle = L.circle([lat, lng], {
                            color: '#2980b9',
                            fillColor: '#3498db',
                            fillOpacity: 0.3,
                            radius: accuracy
                        }).addTo(map);

                        map.setView([lat, lng], 16);
                    },
                    (error) => {
                        alert("Location access failed: Please ensure location/GPS services are enabled on your device and browser permissions are allowed.");
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        }

        locateUser();

        // 4. Quarters & Neighborhoods
        const quarters = [
            { name: "Foumbot Centre / Ville", lat: 5.5083, lng: 10.6308, desc: "Urban town center" },
            { name: "Quartier Ngouongouo (Nhoungou)", lat: 5.5100, lng: 10.6280, desc: "Dense residential quarter in West Foumbot" },
            { name: "Quartier Foumbot-Mancha", lat: 5.5120, lng: 10.6250, desc: "North-western residential zone" },
            { name: "Quartier Koupara", lat: 5.4980, lng: 10.6350, desc: "Southern entry area along N6" },
            { name: "Quartier Mangoum", lat: 5.4850, lng: 10.6120, desc: "Agricultural market hub area" },
            { name: "Quartier Ngouen", lat: 5.5200, lng: 10.6400, desc: "North-east quarter" },
            { name: "Quartier Kougham", lat: 5.5150, lng: 10.6150, desc: "Western district" },
            { name: "Quartier Baigom", lat: 5.5350, lng: 10.6500, desc: "Outer northern village district" },
            { name: "Quartier Fosset", lat: 5.4920, lng: 10.6220, desc: "South-western quarter" },
            { name: "Quartier Njimbouot", lat: 5.5030, lng: 10.6340, desc: "Central-south neighborhood" },
            { name: "Quartier Kompani", lat: 5.5250, lng: 10.6200, desc: "North-western district" },
            { name: "Quartier Mbanjou", lat: 5.4950, lng: 10.6450, desc: "South-eastern neighborhood" },
            { name: "Quartier Marché Central", lat: 5.5065, lng: 10.6310, desc: "Central trade market" },
            { name: "Quartier Administrative", lat: 5.5040, lng: 10.6290, desc: "Sous-Préfecture and Town Hall" }
        ];

        quarters.forEach(q => {
            const layer = L.circle([q.lat, q.lng], {
                color: '#2980b9',
                fillColor: '#3498db',
                fillOpacity: 0.2,
                radius: 350
            }).addTo(map).bindPopup(`
                <b>Quarter: ${q.name}</b><br>${q.desc}<br>
                <div class="popup-coords">📍 ${q.lat.toFixed(4)}, ${q.lng.toFixed(4)}</div>
            `);
            searchRegistry.push({ name: q.name, lat: q.lat, lng: q.lng, layer: layer });
        });

        // 5. Carrefours (Intersections)
        const carrefours = [
            { name: "Carrefour Marché Central", lat: 5.5070, lng: 10.6312, desc: "Main central junction" },
            { name: "Carrefour Sous-Préfecture", lat: 5.5042, lng: 10.6295, desc: "Administrative junction" },
            { name: "Carrefour Cimencam", lat: 5.5110, lng: 10.6290, desc: "Commercial strip junction" },
            { name: "Carrefour Koupara (N6)", lat: 5.5000, lng: 10.6340, desc: "Southern entry intersection" },
            { name: "Carrefour Mangoum", lat: 5.4880, lng: 10.6150, desc: "Agricultural trade junction" },
            { name: "Carrefour Ngouongouo", lat: 5.5095, lng: 10.6275, desc: "Ngouongouo quarter junction" },
            { name: "Carrefour Hospital / Santé", lat: 5.5055, lng: 10.6270, desc: "District hospital junction" },
            { name: "Carrefour Station Total / N6", lat: 5.5085, lng: 10.6325, desc: "Highway fuel station junction" }
        ];

        carrefours.forEach(c => {
            const layer = L.circleMarker([c.lat, c.lng], {
                radius: 8,
                fillColor: "#e67e22",
                color: "#d35400",
                weight: 2,
                fillOpacity: 0.9
            }).addTo(map).bindPopup(`
                <b>🚥 ${c.name}</b><br>${c.desc}<br>
                <div class="popup-coords">📍 ${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}</div>
            `);
            searchRegistry.push({ name: c.name, lat: c.lat, lng: c.lng, layer: layer });
        });

        // 6. Bus Stations & Travel Agencies
        const busStations = [
            { name: "Gare Routière Principale", lat: 5.5075, lng: 10.6320, details: "Main central taxi & minibus park" },
            { name: "Musango Bus Terminal", lat: 5.5090, lng: 10.6300, details: "Inter-city travel agency" },
            { name: "General Express Transit Stop", lat: 5.5060, lng: 10.6315, details: "Regional bus stop along N6" },
            { name: "Gare Routière de Mangoum", lat: 5.4870, lng: 10.6140, details: "Local market bus park" }
        ];

        busStations.forEach(station => {
            const layer = L.marker([station.lat, station.lng])
                .addTo(map)
                .bindPopup(`
                    <b>🚌 ${station.name}</b><br>${station.details}<br>
                    <div class="popup-coords">📍 ${station.lat.toFixed(4)}, ${station.lng.toFixed(4)}</div>
                `);
            searchRegistry.push({ name: station.name, lat: station.lat, lng: station.lng, layer: layer });
        });

        // Search Functionality
        function searchLocation() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) return;

            const match = searchRegistry.find(item => item.name.toLowerCase().includes(query));
            if (match) {
                map.setView([match.lat, match.lng], 16);
                match.layer.openPopup();
            }
        }
    </script>
</body>
</html>
