<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxwell Damian Interactive Foumbot Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #2e7d32;
            color: white;
            padding: 12px;
            text-align: center;
        }

        /* Filter control bar */
        .filter-bar {
            background: #ffffff;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #f0f0f0;
            border: 1px solid #ccc;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .filter-btn.active {
            background: #2e7d32;
            color: white;
            border-color: #2e7d32;
        }

        #map {
            flex-grow: 1;
            width: 100%;
        }

        /* Custom GPS Locate Button */
        .gps-btn {
            position: absolute;
            bottom: 25px;
            right: 15px;
            z-index: 1000;
            background: white;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gps-btn:active {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

<header>
    <h2>Maxwell Damian Interactive Foumbot Map</h2>
</header>

<div class="filter-bar">
    <button class="filter-btn active" onclick="filterMarkers('all', this)">All</button>
    <button class="filter-btn" onclick="filterMarkers('quarters', this)">Quarters</button>
    <button class="filter-btn" onclick="filterMarkers('health', this)">Health</button>
    <button class="filter-btn" onclick="filterMarkers('markets', this)">Markets</button>
</div>

<div id="map"></div>
<button class="gps-btn" onclick="locateUser()" title="Find My Location">📍</button>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Initialize map centered on Foumbot
    const map = L.map('map').setView([5.5080, 10.6280], 14);

    // OpenStreetMap Tile Layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Custom Icons
    const quarterIcon = L.icon({
        iconUrl: 'https://cdn-icons-png.flaticon.com/512/25/25694.png',
        iconSize: [28, 28],
        iconAnchor: [14, 28],
        popupAnchor: [0, -28]
    });

    const healthIcon = L.icon({
        iconUrl: 'https://cdn-icons-png.flaticon.com/512/3063/3063822.png',
        iconSize: [28, 28],
        iconAnchor: [14, 28],
        popupAnchor: [0, -28]
    });

    const marketIcon = L.icon({
        iconUrl: 'https://cdn-icons-png.flaticon.com/512/1170/1170678.png',
        iconSize: [28, 28],
        iconAnchor: [14, 28],
        popupAnchor: [0, -28]
    });

    // Store all markers with categories
    const allMarkers = [];

    function addPlace(lat, lng, name, type, description, icon) {
        const marker = L.marker([lat, lng], { icon: icon }).addTo(map);
        marker.bindPopup(`
            <div style="text-align:center;">
                <h3 style="margin:0; color:#2e7d32;">${name}</h3>
                <p style="margin:5px 0;">${description}</p>
            </div>
        `);
        allMarkers.push({ instance: marker, category: type });
    }

    // Add Foumbot Quarters and Places
    addPlace(5.5080, 10.6280, "Ngouongouo", "quarters", "Cartier Nhoungouo district.", quarterIcon);
    addPlace(5.5120, 10.6310, "Cosba", "quarters", "Cosba neighborhood area.", quarterIcon);
    addPlace(5.5030, 10.6220, "Mangoum", "quarters", "Mangoum quarter district.", quarterIcon);
    addPlace(5.5150, 10.6250, "Musango", "quarters", "Musango area.", quarterIcon);
    addPlace(5.5000, 10.6350, "Cimencam", "quarters", "Cimencam quarter district.", quarterIcon);

    // Sample Health & Market locations
    addPlace(5.5100, 10.6290, "Foumbot District Hospital", "health", "Main medical center in town.", healthIcon);
    addPlace(5.5070, 10.6270, "Foumbot Main Market", "markets", "Central commercial market hub.", marketIcon);

    // Filter Markers Function
    function filterMarkers(category, btnElement) {
        // Update active class on buttons
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');

        // Show/hide markers
        allMarkers.forEach(item => {
            if (category === 'all' || item.category === category) {
                map.addLayer(item.instance);
            } else {
                map.removeLayer(item.instance);
            }
        });
    }

    // Live GPS Location Tracker
    let userLocationMarker = null;

    function locateUser() {
        map.locate({ setView: true, maxZoom: 16 });
    }

    map.on('locationfound', function(e) {
        if (userLocationMarker) {
            map.removeLayer(userLocationMarker);
        }
        userLocationMarker = L.circleMarker(e.latlng, {
            radius: 8,
            fillColor: "#0288d1",
            color: "#ffffff",
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
        }).addTo(map).bindPopup("<b>You are here!</b>").openPopup();
    });

    map.on('locationerror', function() {
        alert("Unable to find your location. Please make sure location services are turned on.");
    });
</script>

</body>
</html>
